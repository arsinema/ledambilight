name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: РЎР°РјРѕС‚РµСЃС‚
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: РџСЂРѕРІРµСЂРєР° СЃРёРЅС‚Р°РєСЃРёСЃР°
        run: python -m compileall -q ledapp main.py selftest.py build_exe.py

      - name: РЎР°РјРѕС‚РµСЃС‚
        run: python selftest.py

  build:
    name: РЎР±РѕСЂРєР° exe
    needs: selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: РЎР±РѕСЂРєР°
        run: python build_exe.py

      - name: РџСЂРѕРІРµСЂРєР° РІРµСЂСЃРёРё РІ exe
        shell: pwsh
        run: |
          $expected = (python -c "import ledapp; print(ledapp.__version__)").Trim()
          $info = (Get-Item dist/LEDAmbilight.exe).VersionInfo
          Write-Host "РћР¶РёРґР°РµС‚СЃСЏ: $expected"
          $info | Format-List ProductName, ProductVersion, FileVersion
          $actual = $info.ProductVersion.Trim()
          if (-not $actual.StartsWith($expected)) {
            throw "Р’РµСЂСЃРёСЏ РІ exe ($actual) РЅРµ СЃРѕРІРїР°РґР°РµС‚ СЃ __version__ ($expected)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: LEDAmbilight-exe
          path: dist/LEDAmbilight.exe
          retention-days: 7

